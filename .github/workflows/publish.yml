name: Publish briefing

on:
  schedule:
    # 8:07 UTC ≈ 3-4am Eastern. Minute offset from :00 avoids the
    # top-of-hour congestion GitHub's docs warn can delay or drop runs.
    - cron: "7 8 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run briefing script
        run: python3 morning_summary.py

      - name: Prepare Pages content
        run: |
          mkdir -p _site
          cp output/briefing.html _site/index.html
          cp manifest.json _site/manifest.json
          cp -R icons _site/icons

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
